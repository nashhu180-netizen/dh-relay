name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-core:
    name: relay-core (Node test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: relay-core/package-lock.json
      - run: npm ci
      - run: npm test

  relay-tests-pwsh:
    name: relay-tests (PowerShell runner, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    # Windows 是这套 PowerShell Runner 的真实运行环境，作硬门禁。
    # ubuntu 这份此前没人实测过是否全绿（部分 suite 依赖 psmux，CI 上不存在，
    # 它们自己会打印 "SUITE SKIP" 并被 runner 计入 skipped），先设 continue-on-error，
    # 实测通过后去掉。
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: pwsh -NoProfile -File tools/tests/run-relay-tests.ps1

  relay-light-python:
    name: relay-light (Python unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # relay-light 的 Linux 回归入口（HC-RL-A15）。测试文件由 RLT_10 落地，
      # 在此之前该 job 只是打印跳过并成功退出。
      - name: Run relay-light unittest (if present)
        run: |
          if [ -f tools/relay-light/test_relay_log.py ]; then
            python3 -m unittest discover -s tools/relay-light -p 'test_*.py' -v
          else
            echo "tools/relay-light/test_relay_log.py not found yet (RLT_10 pending) - skipping"
            exit 0
          fi
