# 本计划专用角色路由（relay_log 经 --config-dir 读取；不改 ~/.claude/skills 副本）。
# 2026-09-21 首跑试点：用户指定编排 opus medium、其余 codex luna 省成本；decider/planner/strategist 保持 fable medium；改这里即改本计划全部角色。

[planner]
model = "fable medium"
launch = "claude --model fable --effort medium --dangerously-skip-permissions"

[orchestrator]
model = "opus medium"
launch = "claude --model opus --effort medium --dangerously-skip-permissions"

[monitor]
model = "codex luna medium"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never"

[builder]
model = "codex luna medium"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never"

[plan-reviewer]
model = "codex luna medium 只读"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never --sandbox read-only"

[coder]
model = "codex luna high"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=high -a never"

[scribe]
model = "codex luna medium"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never"

[checker]
model = "codex luna medium 只读"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never --sandbox read-only"

[decider]
model = "fable medium"
launch = "claude --model fable --effort medium --dangerously-skip-permissions"

[reviewer]
model = "codex luna medium 只读"
launch = "codex -m gpt-5.6-luna -c model_reasoning_effort=medium -a never --sandbox read-only"

[strategist]
model = "fable medium"
launch = "claude --model fable --effort medium --dangerously-skip-permissions"

# RLT_29 试跑：把监工的机械职责拆给便宜的 watcher（不进 SKILL 角色表，只在本计划 config 生效）
[watcher]
model = "omp deepseek-flash low"
launch = "omp --model opencode-go/deepseek-flash --thinking low"
